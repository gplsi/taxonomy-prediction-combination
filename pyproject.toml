[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "taxonomy-ensemble"
version = "0.1.0"
description = "Rank-aware combination of two taxonomy discovery systems"
requires-python = ">=3.10"

[project.scripts]
taxonomy-ensemble = "taxensemble.cli:main"

[tool.setuptools]
packages = ["taxensemble"]
